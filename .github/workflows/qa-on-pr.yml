name: QA Agent — PR

on:
  pull_request:
    types: [opened, synchronize]
    # Only run when product code changes — skip test-only, docs, config PRs.
    # Customize paths per project (src/, app/, functions/, supabase/, etc.)
    paths:
      - 'src/**'
      - 'app/**'
      - 'public/**'
      - 'functions/**'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target project
        uses: actions/checkout@v4

      - name: Checkout QA Agent
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/qa-agent
          path: .qa-agent

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run QA Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MODE: pr
        run: node .qa-agent/src/index.js
