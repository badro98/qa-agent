name: QA Agent — Regression

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running regression?'
        required: false
        default: 'Manual regression run'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target project
        uses: actions/checkout@v4

      - name: Checkout QA Agent
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/qa-agent
          path: .qa-agent

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run QA Agent (Regression Mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: regression
          REASON: ${{ github.event.inputs.reason }}
        run: node .qa-agent/src/index.js
